services:
  homelab-web:
    build: .
    # image: ghcr.io/<you>/homelab-web:latest
    container_name: homelab-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    # If a service works from the host (curl) but not from the dashboard, the container does not
    # share the host's DNS and routes (local DNS, NetBird / Tailscale / WireGuard interfaces).
    # Share the host network instead: remove "ports" above and uncomment the next line
    # (the dashboard then listens on the host's port 3000, or PORT from .env).
    # network_mode: host
    volumes:
      # SQLite database in a Docker-managed volume: nothing to create or chown on the host.
      - homelab-data:/data
      # Or a host folder (the container fixes its ownership at startup):
      # - ./data:/data

volumes:
  homelab-data:
